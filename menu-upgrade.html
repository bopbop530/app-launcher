<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>시그 메뉴 — Wheel Menu</title>
    <script>
      try {
        window.external.SetLocalProperty("prop:Browser60fps", "1");
      } catch (e) {}
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@kfonts/nanum-square-round/index.css"
    />
    <style>
      :root {
        /* Board size — override with ?w=440&h=700 */
        --board-w: 440px;
        --board-h: 700px;
        /* Etude House palette: white base, baby pink, hot-pink accents */
        --baby-pink: #f9b8d0; /* border, soft fills */
        --blush: #fde6ee; /* tints, dots */
        --hot-pink: #ec4d8b; /* title band, prices, buttons */
        --hot-pink-dark: #d63b78;
        --mint: #3fbfa9; /* 추천 */
        --ink: #4b3a44; /* item names, warm charcoal */
        --border-w: 5px;
        --title-h: 78px;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: "NanumSquareRound", "Noto Sans KR", sans-serif;
        font-weight: 800;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 40px;
        padding: 8px;
        width: max-content;
      }

      /* ---------- board ---------- */
      .board {
        width: var(--board-w);
        height: var(--board-h);
        box-sizing: border-box;
        background: #fff;
        border: var(--border-w) solid var(--baby-pink);
        border-radius: 34px;
        box-shadow:
          0 7px 0 #f29cbd,
          0 14px 34px rgba(236, 77, 139, 0.28);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* lace-style inner line */
      .board::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 2px dashed var(--baby-pink);
        border-radius: 26px;
        pointer-events: none;
        z-index: 6;
        opacity: 0.8;
      }

      /* ---------- title band ---------- */
      .board-title {
        flex: 0 0 var(--title-h);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--hot-pink);
        color: #fff;
        font-size: 36px;
        letter-spacing: 3px;
        text-shadow: 0 2px 0 var(--hot-pink-dark);
        border-bottom: 4px solid #fff;
        border-radius: 0 0 32px 32px;
        position: relative;
        z-index: 3;
        box-shadow: 0 0 0 3px var(--baby-pink), 0 6px 14px rgba(236, 77, 139, 0.25);
      }

      /* ---------- wheel viewport ---------- */
      .wheel {
        flex: 1 1 auto;
        position: relative;
        z-index: 1;
        overflow: hidden;
        /* white centre -> faint blush edges, with whisper-faint candy stripes */
        background:
          repeating-linear-gradient(
            -45deg,
            rgba(249, 184, 208, 0.07) 0 14px,
            transparent 14px 28px
          ),
          radial-gradient(ellipse 80% 70% at 50% 45%, #fff 35%, #fff1f6 100%);
        /* fade the top / bottom rims of the wheel */
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          #000 12%,
          #000 88%,
          transparent 100%
        );
        mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          #000 12%,
          #000 88%,
          transparent 100%
        );
      }

      /* outline band marking the "front" of the wheel (no fill, so blush
         title pills stay visible as they pass through) */
      .wheel::before {
        content: "";
        position: absolute;
        left: 16px;
        right: 16px;
        top: 50%;
        height: 60px;
        transform: translateY(-50%);
        border-radius: 999px;
        background: transparent;
        border: 2px solid var(--baby-pink);
        box-sizing: border-box;
        pointer-events: none;
      }

      .menu-item {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 52px;
        padding: 0 28px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 34px;
        white-space: nowrap;
        will-change: transform, opacity;
        transform-origin: 50% 50%;
        visibility: hidden;
      }

      .price {
        color: var(--hot-pink);
      }

      /* price-only ladder rows are long — shrink so they fit the board */
      .menu-item.ladder {
        font-size: 29px;
        letter-spacing: -0.5px;
      }

      .name {
        color: var(--ink);
      }

      .title-name {
        font-style: italic;
        color: var(--hot-pink);
        font-size: 1.05em;
        padding: 0 14px 2px;
        background: var(--blush);
        border-radius: 999px;
      }

      .new {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        color: #fff;
        font-size: 0.68em;
        margin-left: 6px;
        letter-spacing: 1px;
        padding: 6px 10px 5px;
        background: var(--hot-pink);
        border: 2px solid #fff;
        border-radius: 999px;
        box-shadow: 0 0 0 2px var(--baby-pink);
        animation: pulse 1.2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.12);
        }
      }

      .rec {
        color: var(--mint);
        font-size: 0.75em;
        margin-left: 6px;
        letter-spacing: 1px;
        font-style: italic;
        animation: sizzle 0.7s infinite alternate;
      }

      @keyframes sizzle {
        0% {
          opacity: 1;
          filter: brightness(1);
        }
        50% {
          opacity: 0.85;
          filter: brightness(1.25);
        }
        100% {
          opacity: 1;
          filter: brightness(1);
        }
      }

      .error {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--hot-pink-dark);
        font-size: 24px;
        text-align: center;
        padding: 20px;
      }

      /* ---------- speed controls ---------- */
      /* Hidden on stream; appears when the mouse is over the page
         (OBS "Interact" window) or with ?controls=1 */
      .controls {
        width: var(--board-w);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: #fff;
        border: 3px solid var(--baby-pink);
        border-radius: 999px;
        box-shadow: 0 4px 14px rgba(236, 77, 139, 0.2);
        color: var(--ink);
        font-size: 16px;
        opacity: 0;
        transition: opacity 0.2s;
        user-select: none;
      }
      body:hover .controls,
      body.show-controls .controls {
        opacity: 1;
      }
      body.hide-controls .controls {
        display: none;
      }

      .controls button {
        font: inherit;
        font-weight: 800;
        width: 40px;
        height: 34px;
        border-radius: 999px;
        border: 2px solid var(--hot-pink);
        background: #fff;
        color: var(--hot-pink);
        cursor: pointer;
        line-height: 1;
      }
      .controls button:hover,
      .controls button.active {
        background: var(--hot-pink);
        color: #fff;
      }

      .controls input[type="range"] {
        flex: 1 1 auto;
        accent-color: var(--hot-pink);
        cursor: pointer;
      }

      .controls .readout {
        min-width: 52px;
        text-align: right;
        color: var(--hot-pink);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="board">
      <div class="board-title">
        <span>시그 메뉴</span>
      </div>
      <div class="wheel" id="wheel"></div>
    </div>

    <div class="controls" id="controls">
      <button id="btnPause" title="일시정지 (Space)">⏸</button>
      <button id="btnSlower" title="느리게 (-)">−</button>
      <input
        id="speed"
        type="range"
        min="0.1"
        max="3"
        step="0.1"
        value="1"
        title="속도"
      />
      <button id="btnFaster" title="빠르게 (+)">+</button>
      <span class="readout" id="readout">1.0×</span>
    </div>

    <script>
      // -------------------------------------------------------
      // GOOGLE SHEETS CONFIG
      // Replace the URL below with your published CSV link:
      // In Google Sheets → File → Share → Publish to web
      // → Select your sheet → CSV format → Copy link
      // -------------------------------------------------------
      const SHEET_CSV_URL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vSo-zje1qkT-ohA1ytKBcD0_51OyVp3Vy9XFf3K2tenZ7LPz65k1EZhsme513FdAg/pub?gid=2036760252&single=true&output=csv";

      // -------------------------------------------------------
      // URL PARAMS
      //   ?speed=1.2     starting speed (× slots per second)
      //   ?controls=1    always show the speed bar
      //   ?controls=0    never show it
      //   ?w=440&h=700   board size in px
      // -------------------------------------------------------
      const params = new URLSearchParams(location.search);
      if (params.get("w")) document.documentElement.style.setProperty("--board-w", params.get("w") + "px");
      if (params.get("h")) document.documentElement.style.setProperty("--board-h", params.get("h") + "px");
      if (params.get("controls") === "1") document.body.classList.add("show-controls");
      if (params.get("controls") === "0") document.body.classList.add("hide-controls");

      // -------------------------------------------------------
      // CSV PARSER
      // Expected columns (row 1 = headers):
      //   Type | Name | Price | New | Rec
      //
      // Type values:
      //   item    — normal menu item (price + name + optional badges)
      //   title   — section header (name only, no price)
      //   ladder  — price only row (no name)
      //   divider — blank spacer row
      //
      // New  — type "yes" to show the NEW badge, leave blank otherwise
      // Rec  — type "yes" to show the 추천 badge, leave blank otherwise
      // -------------------------------------------------------
      function parseCSV(text) {
        const lines = text.trim().split("\n");
        if (lines.length < 2) return [];
        const headers = lines[0]
          .split(",")
          .map((h) => h.trim().toLowerCase().replace(/\r/g, ""));
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = [];
          let cur = "",
            inQ = false;
          for (let c = 0; c < lines[i].length; c++) {
            const ch = lines[i][c];
            if (ch === '"') {
              inQ = !inQ;
            } else if (ch === "," && !inQ) {
              cols.push(cur.trim());
              cur = "";
            } else {
              cur += ch;
            }
          }
          cols.push(cur.trim().replace(/\r/g, ""));
          const row = {};
          headers.forEach((h, idx) => {
            row[h] = cols[idx] || "";
          });
          rows.push(row);
        }
        return rows;
      }

      function itemHTML(item) {
        const type = (item.type || "").trim().toLowerCase();
        const name = (item.name || "").trim();
        const price = (item.price || "").trim();
        const isNew = item.new && item.new.trim().toLowerCase() === "yes";
        const isRec = item.rec && item.rec.trim().toLowerCase() === "yes";

        if (type === "divider") return "";
        if (type === "title") return `<span class="name title-name">${name}</span>`;
        if (type === "ladder") return `<span class="price">${price}</span>`;
        return `
          <span class="price">${price}</span>
          <span class="name">${name}</span>
          ${isNew ? `<span class="new">new</span>` : ""}
          ${isRec ? `<span class="rec">추천</span>` : ""}
        `;
      }

      // -------------------------------------------------------
      // WHEEL
      // Every row is a slot on a vertical cylinder seen from the side.
      // Slot i sits at angle  a = i*STEP - offset  (wrapped to the loop),
      // where a = 0 is the front/centre, -PI/2 the top rim, +PI/2 the
      // bottom rim. The offset grows over time so rows travel
      // bottom → top. Text stays upright; only y / scale / opacity
      // follow the curve.
      // -------------------------------------------------------
      const SLOT_H = 52; // px, must match .menu-item height
      const wheel = document.getElementById("wheel");

      let slots = []; // { el }
      let R = 300; // wheel radius (px) — half the viewport height
      let STEP = SLOT_H / R; // angular size of one slot (rad)
      let LOOP = 0; // total angular length of the loop
      let offset = 0; // current rotation (rad)

      function buildWheel(items) {
        wheel.innerHTML = "";
        slots = [];
        if (!items.length) return;

        measure();
        // Repeat the list until it wraps all the way around the cylinder,
        // so short menus still form a continuous wheel.
        let list = items.slice();
        while (list.length * STEP < Math.PI * 2 + STEP) list = list.concat(items);

        const frag = document.createDocumentFragment();
        list.forEach((item) => {
          const el = document.createElement("div");
          const type = (item.type || "").trim().toLowerCase();
          el.className = "menu-item" + (type ? " " + type : "");
          el.innerHTML = itemHTML(item);
          frag.appendChild(el);
          slots.push({ el });
        });
        wheel.appendChild(frag);
        LOOP = slots.length * STEP;
      }

      function measure() {
        R = Math.max(80, wheel.clientHeight / 2);
        STEP = SLOT_H / R;
        LOOP = slots.length * STEP;
      }

      function layout() {
        const half = Math.PI / 2;
        for (let i = 0; i < slots.length; i++) {
          // wrap into [-LOOP/2, LOOP/2)
          let a = (i * STEP - offset) % LOOP;
          if (a < -LOOP / 2) a += LOOP;
          else if (a >= LOOP / 2) a -= LOOP;

          const el = slots[i].el;
          if (a <= -half || a >= half) {
            if (el.style.visibility !== "hidden") el.style.visibility = "hidden";
            continue;
          }
          const c = Math.cos(a);
          const y = R * Math.sin(a) - SLOT_H / 2;
          const s = 0.55 + 0.45 * c;
          el.style.visibility = "visible";
          el.style.transform = `translate3d(0, ${y.toFixed(2)}px, 0) scale(${s.toFixed(3)})`;
          el.style.opacity = Math.pow(c, 0.8).toFixed(3);
          el.style.zIndex = Math.round(c * 100);
        }
      }

      // -------------------------------------------------------
      // SPEED CONTROLS  (1.0× = one slot per second through the centre)
      // -------------------------------------------------------
      const LS_KEY = "menuWheel.v1";
      const state = { speed: 1, paused: false };
      try {
        Object.assign(state, JSON.parse(localStorage.getItem(LS_KEY) || "{}"));
      } catch (e) {}
      if (params.get("speed")) state.speed = parseFloat(params.get("speed")) || 1;
      state.speed = clampSpeed(state.speed);

      const speedEl = document.getElementById("speed");
      const readout = document.getElementById("readout");
      const btnPause = document.getElementById("btnPause");

      function clampSpeed(v) {
        return Math.round(Math.min(3, Math.max(0.1, v)) * 10) / 10;
      }
      function save() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(state));
        } catch (e) {}
      }
      function syncUI() {
        speedEl.value = state.speed;
        readout.textContent = state.speed.toFixed(1) + "×";
        btnPause.textContent = state.paused ? "▶" : "⏸";
        btnPause.classList.toggle("active", state.paused);
      }
      function setSpeed(v) {
        state.speed = clampSpeed(v);
        syncUI();
        save();
      }
      function togglePause() {
        state.paused = !state.paused;
        syncUI();
        save();
      }

      speedEl.addEventListener("input", () => setSpeed(parseFloat(speedEl.value)));
      document.getElementById("btnSlower").addEventListener("click", () => setSpeed(state.speed - 0.1));
      document.getElementById("btnFaster").addEventListener("click", () => setSpeed(state.speed + 0.1));
      btnPause.addEventListener("click", togglePause);
      document.addEventListener("keydown", (e) => {
        if (e.target === speedEl) return;
        if (e.code === "Space") { e.preventDefault(); togglePause(); }
        else if (e.key === "+" || e.key === "=") setSpeed(state.speed + 0.1);
        else if (e.key === "-" || e.key === "_") setSpeed(state.speed - 0.1);
      });
      syncUI();

      // -------------------------------------------------------
      // ANIMATION LOOP
      // -------------------------------------------------------
      let last = performance.now();
      function tick(now) {
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        if (slots.length) {
          if (!state.paused) {
            offset = (offset + state.speed * STEP * dt) % LOOP;
          }
          layout();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      window.addEventListener("resize", () => {
        // keep the same slot at the front after a resize
        const slotsIn = offset / STEP;
        measure();
        offset = slotsIn * STEP;
      });

      // -------------------------------------------------------
      // LOAD
      // -------------------------------------------------------
      async function loadMenu() {
        try {
          const res = await fetch(SHEET_CSV_URL);
          if (!res.ok) throw new Error("Fetch failed");
          const text = await res.text();
          buildWheel(parseCSV(text));
        } catch (e) {
          console.error("Failed to load menu:", e);
          wheel.innerHTML = `<div class="error">메뉴를 불러오지 못했습니다.</div>`;
        }
      }

      loadMenu();
    </script>
  </body>
</html>
